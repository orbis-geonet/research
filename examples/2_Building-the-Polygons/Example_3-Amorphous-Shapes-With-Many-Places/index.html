<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canvas Circles and External Tangents</title>
  </head>
  <body>
    <!-- Inputs for numOfPlaces, minRadius, maxRadius and numOfGroups -->
    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
      <div style="display: flex; flex-direction: column;">
        <label for="numOfPlaces">Number of Places:</label>
        <input type="number" id="numOfPlaces" value="10" />
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="minRadius">Minimum Radius:</label>
        <input type="number" id="minRadius" value="10" />
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="maxRadius">Maximum Radius:</label>
        <input type="number" id="maxRadius" value="30" />
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="numOfGroups">Number of Groups:</label>
        <input type="number" id="numOfGroups" value="3" />
      </div>

      <button id="generate">Generate</button>
    </div>

    <canvas id="myCanvas" width="800" height="800" style="border: 1px solid #000000" ></canvas>

    <script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="main.js" type="module"></script>
  </body>
</html>
