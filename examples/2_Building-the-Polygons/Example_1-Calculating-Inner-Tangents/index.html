<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canvas Circles and External Tangents</title>
  </head>
  <body>
    <!-- Radio buttons to switch between internal and external tangents -->
    <div>
      <input type="radio" id="external" name="tangent" value="external" checked>
      <label for="external">External Tangents</label>
      <input type="radio" id="internal" name="tangent" value="internal">
      <label for="internal">Internal Tangents</label>
    </div>

    <canvas id="myCanvas" width="500" height="200" style="border: 1px solid #000000" ></canvas>
    <script src="main.js" type="module"></script>
  </body>
</html>
