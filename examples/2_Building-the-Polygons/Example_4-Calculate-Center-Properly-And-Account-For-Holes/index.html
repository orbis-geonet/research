<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canvas Circles and External Tangents</title>
  </head>
  <body>
    <!-- Input element for precision of center algorithm -->
    <div>
      <label for="precision">Precision:</label>
      <input type="number" id="precision" name="precision" value="20.0" step="0.1">
    </div>

    <canvas id="myCanvas" width="800" height="800" style="border: 1px solid #000000" ></canvas>

    <script src="https://cdn.jsdelivr.net/npm/tinyqueue"></script>
    <script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="main.js" type="module"></script>
  </body>
</html>
